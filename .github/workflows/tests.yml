name: Tests

# Lance les tests de bout en bout (Playwright) à chaque pull request et à chaque envoi sur main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    name: Tests Playwright (ordinateur et téléphone)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Contrôler le code (ESLint et Prettier)
        run: |
          npm run lint
          npm run format:check

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests
        run: npm test
        env:
          CI: "true"

      - name: Conserver les résultats si un test échoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: test-results/
          retention-days: 7
